.wideSelect{

.good{

.bad{

}

#stats{
    font-weight:bold;
}

#wordNumber{
    font-size:20px;

#definition{

<div class="container">

<h1>
UIL 26-27 HS Word List
</h1>

<div class="section">

<h2>
Current Word
</h2>

<div id="wordNumber">
Ready
</div>

<div id="vocabFlag">
</div>

<br>

<div class="inputRow">

<input

<button onclick="submitAnswer()">
Submit
</button>

</div>

<br>

<div id="result"></div>

<div id="definition"></div>

</div>


<div class="section controlRow">

<div class="label">
Words
</div>

<div>

<button onclick="repeatWord()">
Repeat Word (<=)
</button>

<button onclick="nextWord()">
Next Word (=>)
</button>

</div>

</div>


<div class="section controlRow">

<div class="label">
Mode
</div>

<div>

<button onclick="setMode('random')">
Random
</button>

<button onclick="setMode('sequential')">
Sequential
</button>

<button onclick="setMode('vocab')">
Vocabulary
</button>

<button onclick="setMode('missed')">
Missed Words
</button>

</div>

</div>


<div class="section controlRow">

<div class="label">
Range
</div>

<select
 id="rangeSelect"
 onchange="applyRange()">

<option value="all">
All Words
</option>

<option value="1-200">1-200</option>
<option value="201-400">201-400</option>
<option value="401-600">401-600</option>
<option value="601-800">601-800</option>
<option value="801-1000">801-1000</option>
<option value="1001-1200">1001-1200</option>
<option value="1201-1400">1201-1400</option>
<option value="1401-1500">1401-1500</option>

</select>

</div>


<div class="section controlRow">

<div class="label">
Voice
</div>

<select
 id="voiceSelect"
 class="wideSelect">
</select>

</div>


<div class="section">

<h2>
Statistics
</h2>

<div id="stats">
</div>

</div>


<div class="section">

<b>Keyboard Shortcuts</b>

<br>

Enter = Submit / Next Word

<br>

→ = Next Word

<br>

← = Repeat Word

</div>

</div>

y": "Zipf’s law", "acceptable": ["Zipf’s law"], "vocab": false}, {"uilNum": 1498, "display": "ziti", "acceptable": ["ziti"], "vocab": false}, {"uilNum": 1499, "display": "zoonosis •", "acceptable": ["zoonosis"], "vocab": false}, {"uilNum": 1500, "display": "zygapophysis", "acceptable": ["zygapophysis"], "vocab": false}];

let mode = "random";

let currentRange = "all";

let activePool = [...ALL_WORDS];

let currentWord = null;

let selectedVoice = null;

let reviewQueue = [];

let missedWords = [];

let correct = 0;

let incorrect = 0;

let waitingForNextWord = false;

let speechUnlocked = false;

function unlockSpeech(){

    if(speechUnlocked){
        return;
    }

    speechUnlocked = true;

    const u =
        new SpeechSynthesisUtterance(" ");

    speechSynthesis.speak(u);

    speechSynthesis.cancel();
}

function saveData(){

    localStorage.setItem(
        "uilStats",
        JSON.stringify({
            correct: correct,
            incorrect: incorrect
        })
    );
}


function rebuildPool(){

    let words = [...ALL_WORDS];

    if(mode === "vocab"){

        words =
            words.filter(
                w => w.vocab
            );
    }

    if(mode === "missed"){

        words = [...missedWords];
    }

    if(currentRange !== "all"){

        const parts =
            currentRange.split("-");

        const start =
            parseInt(parts[0]);

        const end =
            parseInt(parts[1]);

        words =
            words.filter(
                w =>
                    w.uilNum >= start &&
                    w.uilNum <= end
            );
    }

    activePool = words;

    updateStats();
}


function setMode(m){

    mode = m;

    rebuildPool();
}


function applyRange(){

    currentRange =
        document.getElementById(
            "rangeSelect"
        ).value;

    rebuildPool();
}


function updateStats(){

    let total =
        correct +
        incorrect;

    let pct =
        total
        ?
        (
            (correct / total) * 100
        ).toFixed(1)
        :
        "0";

    document.getElementById(
        "stats"
    ).innerText =

        "Correct: " + correct +

        " | Incorrect: " +
        incorrect +

        " | Accuracy: " +
        pct + "%" +

        " | Review Queue: " +
        reviewQueue.length +

        " | Missed Words: " +
        missedWords.length +

        " | Remaining: " +
        activePool.length;
}


function chooseWord(){

    if(
        reviewQueue.length > 0 &&
        Math.random() < 0.40
    ){
        return reviewQueue.shift();
    }

    if(
        activePool.length === 0
    ){
        return null;
    }

    if(
        mode === "sequential"
    ){

        return activePool.shift();
    }

    const i =
        Math.floor(
            Math.random()
            *
            activePool.length
        );

    return activePool.splice(
        i,
        1
    )[0];
}


function nextWord(){

    unlockSpeech();

    currentWord =
        chooseWord();

    if(!currentWord){

        alert(
            "Session Complete!"
        );

        return;
    }

    document.getElementById(
        "wordNumber"
    ).innerText =
        "UIL Word #" +
        currentWord.uilNum;

    document.getElementById(
        "vocabFlag"
    ).innerText =
        currentWord.vocab
        ?
        "Vocabulary Word"
        :
        "";

    document.getElementById(
        "spellInput"
    ).value = "";

    document.getElementById(
        "result"
    ).innerHTML = "";

    lookupDefinition(
        currentWord.acceptable[0]
    );

    waitingForNextWord = false;

    repeatWord();

    document.getElementById(
        "spellInput"
    ).focus();

    updateStats();
}


function repeatWord(){

    unlockSpeech();

    if(!currentWord){
        return;
    }

    speechSynthesis.cancel();

    let utter =
        new SpeechSynthesisUtterance(
            currentWord.acceptable[0]
        );

    const voices =
        speechSynthesis.getVoices();

    const selectedName =
        document.getElementById(
            "voiceSelect"
        ).value;

    const voice =
        voices.find(
            v => v.name === selectedName
        );

    if(voice){
        utter.voice = voice;
    }

    utter.rate = 0.85;

    utter.onstart = () => {
        console.log("Speech started");
    };

    utter.onerror = e => {
        console.log(
            "Speech error:",
            e
        );
    };

    speechSynthesis.speak(
        utter
    );
}


async function lookupDefinition(word){

    try{

        const response =
            await fetch(
                "https://api.dictionaryapi.dev/api/v2/entries/en/"
                +
                encodeURIComponent(word)
            );

        const data =
            await response.json();

        if(
            data[0] &&
            data[0].meanings &&
            data[0].meanings[0] &&
            data[0].meanings[0].definitions
        ){

            document.getElementById(
                "definition"
            ).innerHTML =

                "<b>Definition:</b><br>"
                +
                data[0]
                .meanings[0]
                .definitions[0]
                .definition;

        }else{

            document.getElementById(
                "definition"
            ).innerHTML =

                "<b>Definition:</b><br>No definition found.";
        }

    }catch{

        document.getElementById(
            "definition"
        ).innerHTML =

            "<b>Definition:</b><br>No definition found.";
    }
}


function submitAnswer(){

    if(
        !currentWord
    ){
        return;
    }

    let answer =
        document.getElementById(
            "spellInput"
        )
        .value
        .trim()
        .toLowerCase();

    let ok =
        currentWord.acceptable.some(
            v =>
                v
                .trim()
                .toLowerCase()
                ===
                answer
        );

    if(ok){

        correct++;

        waitingForNextWord = true;

        document.getElementById(
            "result"
        ).innerHTML =

            "<span class='good'>✅ Correct</span>"
            +
            "<br><br>"
            +
            "<b>Press ENTER for next word</b>";

    }else{

        incorrect++;

        missedWords.push(
            currentWord
        );

        reviewQueue.push(
            currentWord
        );

        waitingForNextWord = true;

        document.getElementById(
            "result"
        ).innerHTML =

            "<span class='bad'>❌ Correct spelling(s): "
            +
            currentWord.display
            +
            "</span>"
            +
            "<br><br>"
            +
            "<b>Press ENTER for next word</b>";
    }
    updateStats();

    saveData();
}


function loadVoices(){

    const voices =
        speechSynthesis.getVoices();

    const select =
        document.getElementById(
            "voiceSelect"
        );

    select.innerHTML = "";

    voices.forEach(v=>{

        const option =
            document.createElement(
                "option"
            );

        option.value = v.name;

        option.textContent =
            v.name;

        select.appendChild(
            option
        );

    });

    selectedVoice =

        voices.find(
            v =>
            v.name.includes(
                "Google US English"
            )
        )
        voices.find(
            v =>
            v.name.includes(
                "Ava"
            )
        )
        ||
        voices.find(
            v =>
            v.name.includes(
                "Aria"
            )
        )
        ||
        voices.find(
            v =>
            v.name.includes(
                "Jenny"
            )
        )
        ||
        voices.find(
            v =>
            v.name.includes(
                "Guy"
            )
        )
        ||
        voices[0];

    if(selectedVoice){

        select.value =
            selectedVoice.name;
    }

    select.onchange = ()=>{

        selectedVoice =
            voices.find(
                v =>
                v.name ===
                select.value
            );
    };
}


speechSynthesis
.onvoiceschanged =
loadVoices;

loadVoices();


document
.getElementById(
    "spellInput"
)
.addEventListener(
    "keydown",
    e => {

        if(
            e.key !== "Enter"
        ){
            return;
        }

        if(
            waitingForNextWord
        ){

            waitingForNextWord =
                false;

            nextWord();

            return;
        }

        submitAnswer();

    }
);


document.addEventListener(
    "keydown",
    e => {

        const typing =
            document.activeElement.id
            ===
            "spellInput";

        if(
            typing &&
            e.key !== "Enter"
        ){
            return;
        }

        if(
            e.key ===
            "ArrowRight"
        ){
            nextWord();
        }

        if(
            e.key ===
            "ArrowLeft"
        ){
            repeatWord();
        }

    }
);


updateStats();

</script>
